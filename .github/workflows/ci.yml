name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make build
      - name: Check macOS's zsh completions are used
        if: runner.os == 'macOS'
        run: |
          ls -d /usr/share/zsh/*/functions
          for c in ls tar grep curl cp rsync; do
            ls /usr/share/zsh/*/functions/_$c 2>/dev/null || echo "no _$c"
            ./bin/commando --dump "$c" > "$c.json" || true
          done
          python3 - <<'PY'
          import json, os
          found = 0
          for c in ["ls", "tar", "grep", "curl", "cp", "rsync"]:
              if not os.path.getsize(c + ".json"):
                  continue
              for o in json.load(open(c + ".json"))["options"]:
                  if o.get("choice_source"):
                      print(c, o["names"], o["choices"], "from", o["choice_source"])
                      found += "zsh" in o["choice_source"]
          assert found, "no option values came from zsh's completions"
          PY

  homebrew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Put Homebrew on PATH (Linux)
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Tap this checkout
        run: brew tap lonedevel/commando "$GITHUB_WORKSPACE"
      - name: Audit formula
        run: brew audit --strict lonedevel/commando/commando
      - name: Style formula
        run: brew style lonedevel/commando/commando
      - name: Install prebuilt binary
        run: brew install lonedevel/commando/commando
      - name: Test formula
        run: brew test lonedevel/commando/commando
      - name: Build HEAD from source
        if: runner.os == 'macOS'
        run: |
          brew uninstall lonedevel/commando/commando
          brew install --HEAD lonedevel/commando/commando
          brew test lonedevel/commando/commando
