name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make build
      - name: Check macOS's zsh completions are used
        if: runner.os == 'macOS'
        run: |
          ./bin/commando --dump curl > curl.json
          python3 - <<'PY'
          import json
          opts = json.load(open("curl.json"))["options"]
          req = next(o for o in opts if "-X" in o["names"])
          print("curl -X:", req.get("choices"), "from", req.get("choice_source"))
          assert "POST" in req.get("choices", []) and "zsh" in req.get("choice_source", "")
          PY

  homebrew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Put Homebrew on PATH (Linux)
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Tap this checkout
        run: brew tap lonedevel/commando "$GITHUB_WORKSPACE"
      - name: Audit formula
        run: brew audit --strict lonedevel/commando/commando
      - name: Style formula
        run: brew style lonedevel/commando/commando
      - name: Install prebuilt binary
        run: brew install lonedevel/commando/commando
      - name: Test formula
        run: brew test lonedevel/commando/commando
      - name: Build HEAD from source
        if: runner.os == 'macOS'
        run: |
          brew uninstall lonedevel/commando/commando
          brew install --HEAD lonedevel/commando/commando
          brew test lonedevel/commando/commando
