name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make build

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: brew tap lonedevel/commando "$GITHUB_WORKSPACE"
      - name: Audit formula
        run: brew audit --strict lonedevel/commando/commando
      - name: Style formula
        run: brew style lonedevel/commando/commando
      - name: Build from source
        run: brew install --build-from-source lonedevel/commando/commando
      - name: Test formula
        run: brew test lonedevel/commando/commando
