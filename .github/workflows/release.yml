name: Release

# Publishes a GitHub release whenever main declares a version (in
# cmd/commando/main.go) that has no tag yet, then opens a pull request that
# points the Homebrew formula at it. To release: bump the version, add its
# section to RELEASE_NOTES.md, merge to main, then merge the formula PR.
on:
  push:
    branches: [main]
    paths:
      - cmd/commando/main.go
      - RELEASE_NOTES.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write # open the formula pull request
  actions: write # start CI on it

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(scripts/version.sh)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        if: steps.version.outputs.exists == 'false'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.version.outputs.exists == 'false'
        run: make lint test

      - name: Build archives
        if: steps.version.outputs.exists == 'false'
        run: make dist VERSION=${{ steps.version.outputs.version }}

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release-notes.sh "$VERSION" > notes.md
          gh release create "v$VERSION" dist/*.tar.gz dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "commando v$VERSION" \
            --notes-file notes.md \
            --latest

      - name: Open the Homebrew formula pull request
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="formula-v$VERSION"
          scripts/update-formula.sh "$VERSION" dist/checksums.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update the Homebrew formula to v$VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update the Homebrew formula to v$VERSION" \
            --body "Points \`Formula/commando.rb\` at the v$VERSION release's prebuilt binaries, with the checksums it published. Opened by the Release workflow; merge it once the homebrew checks pass."
          # Pushes and pull requests made with this workflow's token don't
          # start other workflows, so start CI on the branch explicitly.
          gh workflow run ci.yml --ref "$branch"
